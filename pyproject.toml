[project]
name = "arg-toolkit"
version = "2.2.1"
description = "A collection of ComfyUI nodes for cryptography, steganography, encryption, decryption, and tools needed to both make and solve ARGs (Alternative Reality Games) and secret messages."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "AzelusLightvale", email = "NexusLightvale@protonmail.com" }]
classifiers = [
  "Operating System :: OS Independent",
]
dependencies = [
  "cryptography",
  "invisible-watermark",
  "numpy",
  "pillow",
  "reedsolo",
  "secretpy",
  "stegano",
  "torch",
  "torchaudio",
]

[project.urls]
BugTracker = "https://github.com/AzelusLightvale/ComfyUI-ARG-Toolkit/issues"
Documentation = "https://github.com/AzelusLightvale/ComfyUI-ARG-Toolkit/wiki"
Repository = "https://github.com/AzelusLightvale/ComfyUI-ARG-Toolkit"

[project.optional-dependencies]
dev = [
  "bump-my-version",
  "coverage",  # testing
  "mypy",  # linting
  "pre-commit",  # runs linting on commit
  "pytest",  # testing
  "ruff",  # lintingclass
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.comfy]
PublisherId = "azeluslightvale"
DisplayName = "ComfyUI ARG Toolkit"
Icon = ""
Tags = []
Repository = "https://github.com/AzelusLightvale/ComfyUI-ARG-Toolkit"

includes = []

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "tests",
]

[tool.ruff]
# extend-exclude = ["static", "ci/templates"]
line-length = 140
src = ["src", "tests"]
target-version = "py39"

# Add rules to ban exec/eval
[tool.ruff.lint]
select = [
  "S102",  # exec-builtin
  "S307",  # eval-used
  "W293",
  "F",  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
  # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.setuptools.package-data]
"*" = ["*.*"]
